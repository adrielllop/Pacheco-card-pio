<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacheco Panificadora - Cardápio</title>
    <meta name="robots" content="index,follow" />
    <meta name="description" content="Cardápio da Pacheco Panificadora - Tradição e sabor em cada peça." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #C8A44E;
            --gold-light: #E8D5A3;
            --gold-dark: #9E7A2E;
            --bg-deep: #0A0A0A;
            --bg-card: #141414;
            --bg-elevated: #1C1C1C;
            --text-primary: #F0EBE0;
            --text-secondary: #9A9590;
            --text-muted: #6A6560;
            --border-subtle: rgba(200,164,78,0.12);
            --border-gold: rgba(200,164,78,0.3);
            --shadow-gold: 0 8px 32px rgba(200,164,78,0.08);
            --shadow-lift: 0 12px 40px rgba(0,0,0,0.4);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== AMBIENT BACKGROUND ===== */
        .ambient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .ambient::before {
            content: ''; position: absolute; top: -30%; left: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(ellipse, rgba(200,164,78,0.06) 0%, transparent 70%);
            animation: ambientFloat1 20s ease-in-out infinite;
        }
        .ambient::after {
            content: ''; position: absolute; bottom: -20%; right: -10%;
            width: 50%; height: 50%;
            background: radial-gradient(ellipse, rgba(158,122,46,0.05) 0%, transparent 70%);
            animation: ambientFloat2 25s ease-in-out infinite;
        }
        @keyframes ambientFloat1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,40px) scale(1.1)} }
        @keyframes ambientFloat2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-20px,-30px) scale(1.05)} }

        /* ===== POPUP MENSAGEM DO DIA ===== */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .popup-overlay.visible {
            opacity: 1; visibility: visible;
        }
        .popup-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.4s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .popup-overlay.visible .popup-box {
            transform: scale(1);
        }
        .popup-box h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .popup-box p {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            font-style: italic;
        }
        .popup-close {
            position: absolute; top: 12px; right: 16px;
            width: 32px; height: 32px;
            background: transparent;
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition-fast);
            font-family: 'Inter', sans-serif;
        }
        .popup-close:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: rotate(90deg);
        }

        /* ===== HEADER ===== */
        header {
            position: relative; z-index: 10;
            text-align: center; padding: 4rem 2rem 3rem;
            background: linear-gradient(180deg, var(--bg-deep) 0%, rgba(10,10,10,0.95) 100%);
            border-bottom: 1px solid var(--border-subtle);
        }
        .header-ornament {
            display: flex; align-items: center; justify-content: center;
            gap: 1.2rem; margin-bottom: 1.5rem;
        }
        .ornament-line {
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .ornament-diamond {
            width: 10px; height: 10px;
            border: 1px solid var(--gold);
            transform: rotate(45deg);
        }
        .brand-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem; font-weight: 700;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 40%, var(--gold) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px; text-transform: uppercase; line-height: 1.1;
        }
        .brand-sub {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem; color: var(--text-secondary);
            font-weight: 400; letter-spacing: 6px;
            text-transform: uppercase; margin-top: 0.5rem;
        }

        /* ===== NAV TABS ===== */
        .nav-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .nav-tabs {
            display: flex; justify-content: center; gap: 0.75rem;
            max-width: 500px; margin: 0 auto;
        }
        .nav-tab {
            flex: 1; padding: 0.85rem 1.5rem;
            background: transparent; border: 1.5px solid var(--border-gold);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; border-radius: var(--radius-xl);
            transition: var(--transition-smooth);
            text-transform: uppercase; letter-spacing: 2px;
            position: relative; overflow: hidden;
        }
        .nav-tab::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            opacity: 0; transition: opacity var(--transition-smooth);
        }
        .nav-tab:hover { border-color: var(--gold); color: var(--gold-light); transform: translateY(-1px); }
        .nav-tab.active { border-color: var(--gold); color: var(--bg-deep); font-weight: 700; }
        .nav-tab.active::before { opacity: 1; }
        .nav-tab span { position: relative; z-index: 1; }

        /* ===== WHATSAPP FLOAT ===== */
        .whatsapp-float {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
            width: 58px; height: 58px;
            background: #25D366; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(37,211,102,0.35);
            animation: whatsappPulse 3s ease-in-out infinite;
            text-decoration: none; transition: transform var(--transition-fast);
        }
        .whatsapp-float:hover { transform: scale(1.1); }
        .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }
        .whatsapp-label {
            position: absolute; right: calc(100% + 12px);
            background: var(--bg-elevated); color: var(--text-primary);
            font-size: 0.8rem; font-weight: 500; padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm); white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity var(--transition-fast);
            border: 1px solid var(--border-subtle);
        }
        .whatsapp-float:hover .whatsapp-label { opacity: 1; }
        @keyframes whatsappPulse {
            0%,100%{box-shadow:0 4px 20px rgba(37,211,102,0.35),0 0 0 0 rgba(37,211,102,0.4)}
            50%{box-shadow:0 4px 20px rgba(37,211,102,0.35),0 0 0 12px rgba(37,211,102,0)}
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            position: relative; z-index: 5;
            max-width: 1200px; margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }
        .tab-panel {
            display: none;
            animation: panelFade 0.45s ease forwards;
        }
        .tab-panel.active { display: block; }
        @keyframes panelFade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

        /* ===== SECTION HEADERS ===== */
        .section-divider {
            display: flex; align-items: center; gap: 1.5rem;
            margin: 3rem 0 2.5rem;
        }
        .section-divider:first-child { margin-top: 0; }
        .section-divider::before, .section-divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
        }
        .section-divider h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem; font-weight: 600;
            color: var(--gold); letter-spacing: 3px;
            text-transform: uppercase; white-space: nowrap;
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem; margin-bottom: 3rem;
        }
        .menu-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 0;
            transition: var(--transition-smooth);
            position: relative; overflow: hidden;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-gold);
            box-shadow: var(--shadow-gold), var(--shadow-lift);
        }
        .menu-card.highlight { border-color: var(--border-gold); }
        .card-image-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; }
        .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-smooth); }
        .menu-card:hover .card-image { transform: scale(1.05); }
        .card-image-fallback {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            display: flex; align-items: center; justify-content: center;
            border: 1px dashed var(--border-subtle);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px;
        }
        .highlight-badge {
            position: absolute; top: 14px; right: 14px;
            background: var(--gold); color: var(--bg-deep);
            font-size: 0.7rem; font-weight: 700; padding: 0.3rem 0.8rem;
            border-radius: var(--radius-xl); text-transform: uppercase;
            letter-spacing: 1.5px; z-index: 2;
        }
        .card-body { padding: 1.4rem 1.5rem 1.6rem; }
        .card-title-row {
            display: flex; justify-content: space-between;
            align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem;
        }
        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem; font-weight: 700;
            color: var(--text-primary); line-height: 1.3;
        }
        .card-price {
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem; font-weight: 700; color: var(--gold); white-space: nowrap;
        }
        .card-price.consult {
            color: var(--text-muted); font-size: 0.85rem;
            font-weight: 400; font-style: italic;
        }
        .card-desc {
            color: var(--text-secondary); font-size: 0.88rem;
            line-height: 1.6; margin-top: 0.4rem;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        /* ===== FOOTER ===== */
        footer {
            position: relative; z-index: 5;
            text-align: center; padding: 3rem 2rem 2rem;
            border-top: 1px solid var(--border-subtle);
            background: linear-gradient(180deg, transparent, rgba(10,10,10,0.9));
        }
        .footer-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem; font-weight: 600;
            color: var(--gold); letter-spacing: 2px;
        }
        .footer-details {
            display: flex; justify-content: center; align-items: center;
            gap: 0.5rem; flex-wrap: wrap;
            margin-top: 0.6rem; color: var(--text-muted); font-size: 0.85rem;
        }
        .footer-dot { color: var(--gold-dark); }
        .footer-whatsapp-link {
            color: var(--gold); text-decoration: none;
            font-weight: 500; transition: color var(--transition-fast);
        }
        .footer-whatsapp-link:hover { color: var(--gold-light); }
        .footer-tagline {
            margin-top: 1.2rem; font-size: 0.75rem;
            color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header { padding: 3rem 1.2rem 2rem; }
            .brand-mark { font-size: 2.2rem; letter-spacing: 2px; }
            .brand-sub { font-size: 0.9rem; letter-spacing: 4px; }
            .nav-tabs { gap: 0.5rem; }
            .nav-tab { padding: 0.7rem 1rem; font-size: 0.78rem; letter-spacing: 1px; }
            .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
            .section-divider h2 { font-size: 1.4rem; letter-spacing: 2px; }
            .main-content { padding: 1.5rem 1rem 3rem; }
            .whatsapp-float { bottom: 1.5rem; right: 1.5rem; width: 52px; height: 52px; }
            .whatsapp-float svg { width: 24px; height: 24px; }
            .popup-box { padding: 2rem 1.2rem; }
            .popup-box h3 { font-size: 1.3rem; }
        }

        /* ===== PROTECTIONS ===== */
        body {
            user-select: none; -webkit-user-select: none;
        }
        .menu-card { user-select: text; -webkit-user-select: text; }
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .whatsapp-float { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false" onkeydown="handleKeyDown(event)">

    <div class="ambient"></div>

    <!-- POPUP MENSAGEM DO DIA -->
    <div class="popup-overlay" id="popupMensagem">
        <div class="popup-box">
            <button class="popup-close" id="popupClose" aria-label="Fechar">X</button>
            <h3>Mensagem do Dia</h3>
            <p id="popupTexto"></p>
        </div>
    </div>

    <header>
        <div class="header-ornament">
            <div class="ornament-line"></div>
            <div class="ornament-diamond"></div>
            <div class="ornament-line"></div>
        </div>
        <h1 class="brand-mark" id="nomePadaria">Pacheco Panificadora</h1>
        <p class="brand-sub" id="enderecoPadaria">Tradição & Sabor</p>
    </header>

    <nav class="nav-bar">
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="comidas"><span>Comidas</span></button>
            <button class="nav-tab" data-tab="bebidas"><span>Bebidas</span></button>
        </div>
    </nav>

    <a id="whatsappLink" href="#" target="_blank" rel="noopener noreferrer" class="whatsapp-float" aria-label="Contato via WhatsApp">
        <span class="whatsapp-label">Fale conosco</span>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </a>

    <main class="main-content">
        <div id="comidas" class="tab-panel active"></div>
        <div id="bebidas" class="tab-panel"></div>
    </main>

    <footer>
        <div class="footer-brand" id="footerNome">Pacheco Panificadora</div>
        <div class="footer-details">
            <span id="footerEndereco"></span>
            <span class="footer-dot">|</span>
            <a id="footerWhatsappLink" href="#" target="_blank" rel="noopener noreferrer" class="footer-whatsapp-link"></a>
        </div>
        <p class="footer-tagline">Tradição em cada peça</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        /* ===== PROTEÇÕES ANTI-CÓPIA ===== */
        (function(){
            document.addEventListener('keydown', function(e){
                if(e.key==='F12'||
                   (e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'))||
                   (e.ctrlKey&&(e.key==='U'||e.key==='u')))
                {e.preventDefault();return false;}
            });
            document.addEventListener('dragstart',function(e){e.preventDefault();});
            document.addEventListener('copy',function(e){e.preventDefault();});
        })();

        function handleKeyDown(e){
            if((e.ctrlKey||e.metaKey)&&(e.key==='u'||e.key==='U'))e.preventDefault();
            if(e.key==='F12')e.preventDefault();
            if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'))e.preventDefault();
        }

        /* ===== FIREBASE ===== */
        var firebaseConfig={
            apiKey:"AIzaSyBTS7jExQYt4FJJfW__y7airnXCPoqCKOI",
            authDomain:"pacheco-591ed.firebaseapp.com",
            projectId:"pacheco-591ed",
            storageBucket:"pacheco-591ed.firebasestorage.app",
            messagingSenderId:"468956071001",
            appId:"1:468956071001:web:dd997e14b8c8070f211d48",
            measurementId:"G-764DN5LGP2"
        };
        firebase.initializeApp(firebaseConfig);
        var db=firebase.firestore();

        /* ===== DOM REFS ===== */
        var nomePadaria=document.getElementById('nomePadaria');
        var enderecoPadaria=document.getElementById('enderecoPadaria');
        var footerNome=document.getElementById('footerNome');
        var footerEndereco=document.getElementById('footerEndereco');
        var footerWhatsappLink=document.getElementById('footerWhatsappLink');
        var whatsappLink=document.getElementById('whatsappLink');
        var comidasContainer=document.getElementById('comidas');
        var bebidasContainer=document.getElementById('bebidas');

        // Popup
        var popupOverlay=document.getElementById('popupMensagem');
        var popupTexto=document.getElementById('popupTexto');
        var popupClose=document.getElementById('popupClose');

        popupClose.addEventListener('click',function(){
            popupOverlay.classList.remove('visible');
        });
        popupOverlay.addEventListener('click',function(e){
            if(e.target===popupOverlay) popupOverlay.classList.remove('visible');
        });

        var produtos=[];

        /* ===== CARREGAR CONFIG ===== */
        async function carregarConfiguracoes(){
            try{
                var doc=await db.collection('config').doc('configuracoes').get();
                if(doc.exists){
                    var data=doc.data();
                    var nome=data.nomePadaria||'Pacheco Panificadora';
                    nomePadaria.textContent=nome;
                    enderecoPadaria.textContent=data.endereco||'Tradição & Sabor';
                    footerNome.textContent=nome;
                    footerEndereco.textContent=data.endereco||'';

                    // Mensagem do dia (popup)
                    var msg=data.mensagemDoDia||'';
                    if(msg){
                        popupTexto.textContent=msg;
                        setTimeout(function(){
                            popupOverlay.classList.add('visible');
                        },800);
                    }

                    // WhatsApp como link
                    var whatsRaw=(data.whatsapp||'').replace(/\D/g,'');
                    var whatsFormatted=data.whatsapp||'';
                    if(whatsRaw.length>=11){
                        var whatsNumber='55'+whatsRaw;
                        var whatsUrl='https://wa.me/'+whatsNumber;
                        whatsappLink.href=whatsUrl;
                        footerWhatsappLink.href=whatsUrl;
                        footerWhatsappLink.textContent=whatsFormatted;
                    }else if(whatsRaw){
                        var whatsUrl2='https://wa.me/55'+whatsRaw;
                        whatsappLink.href=whatsUrl2;
                        footerWhatsappLink.href=whatsUrl2;
                        footerWhatsappLink.textContent=whatsFormatted;
                    }else{
                        footerWhatsappLink.textContent=whatsFormatted;
                    }
                }
            }catch(err){console.error('Erro config:',err);}
        }

        /* ===== RENDERIZAR PRODUTOS ===== */
        function renderizarProdutos(){
            comidasContainer.innerHTML='';
            bebidasContainer.innerHTML='';
            var comidas=produtos.filter(function(p){return p.categoria==='comidas';});
            var bebidas=produtos.filter(function(p){return p.categoria==='bebidas';});

            function criarGrid(items,container){
                if(items.length===0){
                    var empty=document.createElement('div');
                    empty.style.cssText='text-align:center;color:var(--text-muted);padding:3rem 2rem;font-size:0.95rem;';
                    empty.textContent='Nenhum produto disponível nesta categoria.';
                    container.appendChild(empty);
                    return;
                }
                items.sort(function(a,b){return(b.destaque?1:0)-(a.destaque?1:0);});
                var grid=document.createElement('div');
                grid.className='menu-grid';

                items.forEach(function(prod){
                    var card=document.createElement('div');
                    card.className='menu-card'+(prod.destaque?' highlight':'');

                    if(prod.destaque){
                        var badge=document.createElement('span');
                        badge.className='highlight-badge';
                        badge.textContent='Destaque';
                        card.appendChild(badge);
                    }

                    var imgWrapper=document.createElement('div');
                    imgWrapper.className='card-image-wrapper';
                    if(prod.imagemURL&&prod.imagemURL.trim()!==''){
                        var img=document.createElement('img');
                        img.src=prod.imagemURL;
                        img.alt=prod.nome;
                        img.className='card-image';
                        img.onerror=function(){
                            this.style.display='none';
                            var fb=document.createElement('div');
                            fb.className='card-image-fallback';
                            fb.textContent='Imagem indisponível';
                            imgWrapper.appendChild(fb);
                        };
                        imgWrapper.appendChild(img);
                    }else{
                        var fb=document.createElement('div');
                        fb.className='card-image-fallback';
                        fb.textContent='Sem imagem';
                        imgWrapper.appendChild(fb);
                    }
                    card.appendChild(imgWrapper);

                    var body=document.createElement('div');
                    body.className='card-body';
                    var titleRow=document.createElement('div');
                    titleRow.className='card-title-row';
                    var title=document.createElement('span');
                    title.className='card-title';
                    title.textContent=prod.nome;
                    var price=document.createElement('span');
                    var hasPrice=prod.preco&&prod.preco.trim()!=='';
                    price.className='card-price'+(!hasPrice?' consult':'');
                    price.textContent=hasPrice?'R$ '+prod.preco:'Consultar';
                    titleRow.appendChild(title);
                    titleRow.appendChild(price);
                    body.appendChild(titleRow);

                    if(prod.descricao){
                        var desc=document.createElement('p');
                        desc.className='card-desc';
                        desc.textContent=prod.descricao;
                        body.appendChild(desc);
                    }
                    card.appendChild(body);
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }

            var hc=document.createElement('div');
            hc.className='section-divider';
            var h2c=document.createElement('h2');
            h2c.textContent='Lanches & Refeições';
            hc.appendChild(h2c);
            comidasContainer.appendChild(hc);
            criarGrid(comidas,comidasContainer);

            var hb=document.createElement('div');
            hb.className='section-divider';
            var h2b=document.createElement('h2');
            h2b.textContent='Bebidas';
            hb.appendChild(h2b);
            bebidasContainer.appendChild(hb);
            criarGrid(bebidas,bebidasContainer);
        }

        /* ===== CARREGAR PRODUTOS ===== */
        function carregarProdutos(){
            db.collection('produtos')
                .orderBy('createdAt','desc')
                .onSnapshot(function(snapshot){
                    produtos=[];
                    snapshot.forEach(function(doc){
                        produtos.push(Object.assign({id:doc.id},doc.data()));
                    });
                    renderizarProdutos();
                },function(err){console.error('Erro:',err);});
        }

        /* ===== TABS ===== */
        document.querySelectorAll('.nav-tab').forEach(function(btn){
            btn.addEventListener('click',function(){
                document.querySelectorAll('.nav-tab').forEach(function(b){b.classList.remove('active');});
                this.classList.add('active');
                var target=this.dataset.tab;
                document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
                document.getElementById(target).classList.add('active');
                window.scrollTo({top:0,behavior:'smooth'});
            });
        });

        /* ===== INIT ===== */
        carregarConfiguracoes();
        carregarProdutos();
    </script>
</body>
</html>
